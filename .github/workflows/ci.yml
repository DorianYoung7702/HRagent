name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
      DEEPSEEK_API_KEY: test-key
      HR_COMPANY_NAME: Example Organization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console-web/package-lock.json
      - run: python -m pip install -c infra/constraints.docker.txt -e ".[dev]"
      - run: python -m ruff check apps services packages scripts tests
      - run: python scripts/check_public_release.py
      - run: npm ci
        working-directory: apps/console-web
      - run: npm run build
        working-directory: apps/console-web
      - run: python -m pytest -q -p no:cacheprovider --basetemp .pytest_ci
