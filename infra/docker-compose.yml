services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recruiting
      POSTGRES_PASSWORD: recruiting
      POSTGRES_DB: recruiting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruiting"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: recruiting
      POSTGRES_PWD: recruiting
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      temporal:
        condition: service_started
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruiting:recruiting@postgres:5432/recruiting
      TEMPORAL_HOST: temporal:7233
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data

  temporal-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruiting:recruiting@postgres:5432/recruiting
      TEMPORAL_HOST: temporal:7233
    command: python -m services.workflow_worker.main
    volumes:
      - ../data:/app/data

  fetch-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.playwright
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruiting:recruiting@postgres:5432/recruiting
    volumes:
      - ../data:/app/data
    shm_size: "2gb"

  reply-ingestion-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.playwright
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruiting:recruiting@postgres:5432/recruiting
      API_BASE_URL: http://api:8000
    command: python -m services.reply_ingestion_worker.main
    volumes:
      - ../data:/app/data
    shm_size: "2gb"

volumes:
  postgres_data:
  redis_data:
